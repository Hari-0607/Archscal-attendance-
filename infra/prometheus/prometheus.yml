global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: attendflow-api
    metrics_path: /api/v1/metrics
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: [api:4000]
