services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set a strong metrics token in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    secrets:
      - metrics_bearer_token
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    expose: ["6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 15s
      timeout: 4s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]
    secrets:
      - metrics_bearer_token
    expose: ["9090"]
    restart: unless-stopped
    depends_on: [api]
    profiles: ["operations"]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped
    depends_on: [prometheus]
    profiles: ["operations"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    expose: ["9200"]
    restart: unless-stopped
    profiles: ["logging"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set Kibana system password in .env}
      SERVER_PUBLICBASEURL: ${KIBANA_ROOT_URL:-http://localhost:5601}
    ports: ["127.0.0.1:5601:5601"]
    restart: unless-stopped
    depends_on: [elasticsearch]
    profiles: ["logging"]

volumes:
  redis-data: {}
  prometheus-data: {}
  grafana-data: {}
  elasticsearch-data: {}

secrets:
  metrics_bearer_token:
    file: ${METRICS_TOKEN_FILE:-./.secrets/metrics-token}
